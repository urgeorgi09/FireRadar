server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://basemaps.cartocdn.com https://*.basemaps.cartocdn.com; img-src 'self' data: blob: https:; font-src 'self' data: https://*.basemaps.cartocdn.com; connect-src 'self' https://basemaps.cartocdn.com https://*.basemaps.cartocdn.com https://challenges.cloudflare.com; worker-src 'self' blob:; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location /api/ {
    proxy_pass http://api:3000/;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 120s;
  }

  location ~* \.(mjs|js)$ {
    default_type application/javascript;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
