name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ── Unit тестове (FWI + services, без DB) ─────────────────────────────────
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install API deps
        run: npm ci
        working-directory: api

      - name: Run unit tests (FWI + services)
        run: npm test
        working-directory: api

      - name: Build API (TypeScript check)
        run: npm run build
        working-directory: api

  # ── Web lint + build ──────────────────────────────────────────────────────
  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web deps
        run: npm ci
        working-directory: web

      - name: Lint web
        run: npm run lint
        working-directory: web

      - name: Build web
        run: npm run build
        working-directory: web

  # ── Docker image builds ───────────────────────────────────────────────────
  docker-builds:
    runs-on: ubuntu-latest
    needs: [unit-tests, web-build]
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f api/Dockerfile.compose -t fireradar-api:ci .

      - name: Build web image
        run: docker build -t fireradar-web:ci ./web

  # ── Integration тест с PostGIS ────────────────────────────────────────────
  integration-test:
    runs-on: ubuntu-latest
    needs: [unit-tests]
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB:       fireradar
          POSTGRES_USER:     fireradar
          # тестови стойности, само за CI
          POSTGRES_PASSWORD: testpass123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fireradar -d fireradar"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL:                   postgres://fireradar:testpass123@localhost:5432/fireradar
      MIGRATION_TEST_DATABASE_URL:    postgres://fireradar:testpass123@localhost:5432/fireradar
      JWT_SECRET:                     ci-test-secret-key-32chars-minimum
      # Без ALLOWED_ORIGINS кодът пада на development origins — не wildcard, безопасно
      ALLOWED_ORIGINS:                http://localhost:5173
      PORT:                           "3000"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install API deps
        run: npm ci
        working-directory: api

      - name: Wait for PostGIS
        run: |
          for i in {1..20}; do
            pg_isready -h localhost -U fireradar -d fireradar && break
            sleep 2
          done

      - name: Build API
        run: npm run build
        working-directory: api

      - name: Apply schema
        run: |
          node -e "
            import('./dist/db/client.js').then(async m => {
              const sql = m.default;
              const { readFileSync } = await import('fs');
              const schema = readFileSync('src/db/schema.sql', 'utf8');
              try { await sql.unsafe(schema); } catch(e) { console.error(e.message); process.exit(1); }
              console.log('Schema applied');
              await sql.end();
            });
          "
        working-directory: api

      # (1) Integration тест с MIGRATION_TEST_DATABASE_URL зададен — тестът НЕ се пропуска
      - name: Run migration integration tests
        run: npx vitest run src/db/migrate.integration.test.ts
        working-directory: api

      # (2) Реален health тест: стартираме компилирания API, изчакваме порта, curl --fail
      - name: Start API and test /health
        run: |
          node dist/index.js > /tmp/api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true; wait "$api_pid" 2>/dev/null || true' EXIT

          echo "Изчакваме API на порт 3000..."
          for i in $(seq 1 30); do
            if curl --fail --silent http://localhost:3000/health > /dev/null 2>&1; then
              echo "✓ API отговаря"
              curl --fail http://localhost:3000/health
              exit 0
            fi
            echo "  Опит $i/30 — изчакваме 2 сек..."
            sleep 2
          done

          echo "✗ API не отговори в рамките на 60 сек"
          cat /tmp/api.log
          exit 1
        working-directory: api
